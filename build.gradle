plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // Event modpack jars live in run/libs/.
    flatDir { dirs "${projectDir}/run/libs" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        // Loads ONLY the base mod - a mods block cannot see a sibling subproject.
        // For a client with the UI use :warengine_pigapl_client:runClient / runClient2.
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// localRuntime = present at runtime, not published to dependents.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Shared with :warengine_pigapl_client - client and server MUST load an identical mod set or
// they are rejected on channel mismatch. Add a pack mod here once, both sides pick it up.
ext.eventModJars = fileTree("${rootDir}/run/libs") {
    include "create-*.jar"          // bundles Flywheel + Ponder
    include "sable-neoforge-*.jar"  // bundles SableCompanion
    include "tacz-*.jar"
    include "xaeroworldmap*"
    // include "createbigcannons-*.jar"  // needs ritchiesprojectilelib, copycats, framedblocks, curios, aeronautics stack
}

dependencies {
    // run/libs/ is not auto-scanned by the dev launcher - this is what puts the jars on the
    // dev classpath. compileOnly for API access, localRuntime so no hard dep is published.
    def eventModJars = rootProject.ext.eventModJars
    compileOnly eventModJars
    localRuntime eventModJars
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
